name: waowo_shop
description: WaowoShop - A complete e-commerce mobile application inspired by Amazon.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.0

  # Database & local storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # API & networking
  http: ^1.1.0
  dio: ^5.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0

  # Navigation
  go_router: ^12.0.0

  # Animations
  lottie: ^2.6.0

  # Images & media
  cached_network_image: ^3.3.0

  # UI/Icons
  google_fonts: ^6.1.0
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
