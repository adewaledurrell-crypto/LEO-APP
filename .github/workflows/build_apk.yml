name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build Android APK (debug + release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Flutter SDK (clone stable branch)
        run: |
          set -e
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: cd waowo_shop && flutter pub get

      - name: Build debug APK
        run: cd waowo_shop && flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: waowo_shop/build/app/outputs/flutter-apk/app-debug.apk

      - name: Try build release APK (may require signing)
        run: |
          set -e
          cd waowo_shop && flutter build apk --release || echo "release build failed or unsigned; see docs"

      - name: Upload release APK artifact (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: waowo_shop/build/app/outputs/flutter-apk/app-release.apk
